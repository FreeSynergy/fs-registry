[package]
name        = "fs-registry"
description = "Service registry for FreeSynergy — what capabilities are available on this node"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
authors     = ["FreeSynergy.Net"]
repository  = "https://github.com/FreeSynergy/fs-registry"

[[bin]]
name = "fs-registry"
path = "src/main.rs"

[dependencies]
# FS
fs-bus = { path = "../fs-bus" }

# Async
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage
sea-orm = { version = "=2.0.0-rc.37", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }

# Error / time
thiserror = "2"
chrono    = { version = "0.4", features = ["serde"] }

# gRPC
tonic = "0.12"
prost = "0.13"

# REST + OpenAPI
axum                = "0.7"
utoipa              = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui   = { version = "8", features = ["axum"] }
tower               = "0.5"
tower-http          = { version = "0.6", features = ["trace"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tonic-build         = "0.12"
protoc-bin-vendored = "3"
